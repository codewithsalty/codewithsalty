<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28">
<defs>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#DC143C" stop-opacity="0"/>
    <stop offset=".18" stop-color="#DC143C"/>
    <stop offset=".5" stop-color="#FF1744"/>
    <stop offset=".82" stop-color="#DC143C"/>
    <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M0 14H1000" stroke="#260b11" stroke-width="1"/>
<path d="M70 14H930" stroke="url(#line)" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="70" cy="14" r="3" fill="#DC143C">
  <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
</circle>
<circle cx="930" cy="14" r="3" fill="#DC143C">
  <animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/>
</circle>
</svg>