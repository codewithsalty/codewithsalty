<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 860 440" width="860" height="440">
<defs>
  <style>
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes livepulse { 0%,100%{opacity:.2} 50%{opacity:1} }
    .cur    { animation: blink 1s step-end infinite }
    .livdot { animation: livepulse 1.3s ease-in-out infinite }
    .mono   { font-family: "Courier New", Courier, monospace }
  </style>
  <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#110202"/>
    <stop offset="100%" stop-color="#060000"/>
  </linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6b0000"/>
    <stop offset="100%" stop-color="#cc1010"/>
  </linearGradient>
  <linearGradient id="leftbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0101"/>
    <stop offset="100%" stop-color="#050000"/>
  </linearGradient>
</defs>

<!-- Card body -->
<rect width="860" height="440" rx="10" fill="url(#cbg)" stroke="#3d0808" stroke-width="1.5"/>

